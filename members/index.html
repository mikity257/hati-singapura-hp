<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>受講生ログイン | HATIスクール</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/members/members.css" />
</head>
<body class="members-center">
  <main class="members-card">
    <h1 class="members-logo">HATI <span>School</span></h1>
    <p class="members-subtitle">受講生専用ページ</p>
    <form id="loginForm" class="members-form">
      <label>
        ユーザー名
        <input type="text" name="username" autocomplete="username" required />
      </label>
      <label>
        パスワード
        <input type="password" name="password" autocomplete="current-password" required />
      </label>
      <p id="loginError" class="members-error" hidden></p>
      <button type="submit" class="members-btn">ログイン</button>
    </form>
  </main>
  <script src="/members/login.js"></script>
</body>
</html>
